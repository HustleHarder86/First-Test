<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Amy Web App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        #main {
            text-align: center;
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            margin-top: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>Hello, Amy! You are About to become super successful and all of your dreams will come true!</h1>
        <button id="alertBtn">Click Me</button>
    </div>
    <script>
        document.getElementById('alertBtn').addEventListener('click', function () {
            alert('Button clicked!');
        });
    </script>
</body>
</html>
